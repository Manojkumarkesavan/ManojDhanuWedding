    .crop-sway { transform-box: view-box; animation: crop-sway 18s ease-in-out infinite alternate; }
    .crop-sway-left { transform-origin: 100px 1007px; }
    .crop-sway-right { transform-origin: 1500px 1007px; animation-delay: -9s; }
    @keyframes tree-sway { from { transform: rotate(-.4deg); } to { transform: rotate(.4deg); } }
    @keyframes crop-sway { from { transform: rotate(-.8deg); } to { transform: rotate(.8deg); } }
    @media (prefers-reduced-motion: reduce) { .tree-sway, .crop-sway { animation: none; } }
